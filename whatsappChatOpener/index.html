<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Open WhatsApp</title>
    
    <style>
        :root {
            --bg-top: #ffffff;
            --bg-bottom: #c0defa;
            --text-main: #1f1f1f;
            --text-hint: #5f6368;
            --pill-bg: #ffffff;
            --pill-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            --icon-color: #4285f4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-top) 45%, var(--bg-bottom) 100%);
            min-height: 100vh; /* Fallback */
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            color: var(--text-main);
        }

        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transform: translateY(-10vh);
            padding: 0 20px;
        }

        .icon-container {
            margin-bottom: 24px;
            /* Simple animated pulse effect for the icon */
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .hero-section h1 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .hero-section p {
            font-size: 0.9rem;
            color: var(--text-hint);
            max-width: 300px;
            margin-bottom: 32px;
        }

        /* Center Input Box */
        .input-wrapper {
            position: relative;
            /* bottom: 40px; removed absolute positioning */
            width: 90%;
            max-width: 450px;
            background: var(--pill-bg);
            border-radius: 50px;
            padding: 8px 12px 8px 24px;
            display: flex;
            align-items: center;
            box-shadow: var(--pill-shadow);
        }

        .input-prefix {
            color: var(--text-hint);
            font-size: 1.2rem;
            margin-right: 12px;
            font-weight: 300;
        }

        input[type="tel"] {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 1rem;
            color: var(--text-main);
            padding: 12px 0;
            width: 100%;
        }

        input[type="tel"]::placeholder {
            color: #9aa0a6;
        }

        .submit-btn {
            background: #e8f0fe;
            color: var(--icon-color);
            border: none;
            border-radius: 50px;
            padding: 10px 16px;
            margin-left: 8px;
            cursor: pointer;
            display: none; /* Hidden by default */
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .submit-btn:hover {
            background: #d2e3fc;
        }

        .submit-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .wa-icon {
            font-size: 48px;
            background: -webkit-linear-gradient(#4285f4, #34a853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <main class="hero-section">
        <div class="icon-container">
            <i class="fa-brands fa-whatsapp wa-icon"></i>
        </div>
        <h1>Ready to chat</h1>
        <p>Enter a WhatsApp number with the country code to open a chat instantly without saving the number</p>

        <div class="input-wrapper">
            <span class="input-prefix">+</span>
            <input 
                type="tel" 
                id="waNumber" 
                placeholder="e.g. 919876543210" 
                oninput="handleInput()"
                autocomplete="off"
            >
            <button id="openBtn" class="submit-btn" onclick="openChat()" aria-label="Open Chat">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </main>

    <script>
        function handleInput() {
            const inputField = document.getElementById('waNumber');
            const openBtn = document.getElementById('openBtn');
            
            // Remove all non-numeric characters
            let cleanedNumber = inputField.value.replace(/\D/g, '');
            inputField.value = cleanedNumber;
            
            // Validate length (7 to 15 digits is typical for international numbers)
            if (cleanedNumber.length >= 7 && cleanedNumber.length <= 15) {
                openBtn.style.display = 'flex';
            } else {
                openBtn.style.display = 'none';
            }
        }

        function openChat() {
            const num = document.getElementById('waNumber').value;
            if (num.length >= 7 && num.length <= 15) {
                // Open WhatsApp link in a new tab
                window.open(`https://wa.me/${num}`, '_blank');
                
                // Clear the input and hide the button after opening
                document.getElementById('waNumber').value = '';
                document.getElementById('openBtn').style.display = 'none';
            }
        }

        // Allow 'Enter' key to submit
        document.getElementById('waNumber').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const num = this.value;
                if (num.length >= 7 && num.length <= 15) {
                    openChat();
                }
            }
        });
    </script>
</body>
</html>
